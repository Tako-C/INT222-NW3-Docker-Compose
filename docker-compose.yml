#version: '3.8'

services:
  dbserver:
    container_name: dbserver
    image: mysql/mysql-server
    ports:
      - '3000:3306'
    environment:
      MYSQL_ROOT_PASSWORD: 'mysql'
    volumes:
      - ./INT222_scrip_create_kradan_kanban.sql:/docker-entrypoint-initdb.d/INT222_scrip_create_kradan_kanban.sql

  backend:
    container_name: backend
    image: backend/image
    build:
      context: ./INT222-NW3-PROJECT-BACKEND
      dockerfile: Dockerfile
    restart: always
    ports:
      - '8080:8080'
    depends_on:
      - dbserver

  reverse_proxy:
    image: nginx:alpine
    container_name: reverse_proxy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./intproj23_test.conf:/etc/nginx/conf.d/default.conf
      - ./certificateFiles/fullchain.pem:/etc/ssl/certs/fullchain.pem
      - ./certificateFiles/privkey.pem:/etc/ssl/private/privkey.pem
      - ./certificateFiles/dhparam-2048.pem:/etc/ssl/certs/dhparam-2048.pem
    depends_on:
      - frontend

  frontend:
    image: frontend/image
    container_name: frontend
    build:
      context: ./INT222-NW3-PROJECT-FRONTEND
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - backend
